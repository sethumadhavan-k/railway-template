name: Publish Dify Railway images

on:
  push:
    branches: [main]
    paths:
      - "dify/nginx/**"
      - "dify/ssrf-proxy/**"
      - "dify/agent-ssrf-proxy/**"
      - ".github/workflows/publish-dify-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: dify-nginx
            context: dify/nginx
            tag: "1.17.0"
          - name: dify-ssrf-proxy
            context: dify/ssrf-proxy
            tag: "1.17.0"
          - name: dify-agent-ssrf-proxy
            context: dify/agent-ssrf-proxy
            tag: "1.17.0"
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:${{ matrix.tag }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}:latest
