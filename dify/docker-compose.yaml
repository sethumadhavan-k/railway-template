# Local analogue of the Railway Dify template.
# For production on Railway, use .railway/railway.ts (IaC).
# Based on https://github.com/langgenius/dify/tree/main/docker

services:
  nginx:
    build: ./nginx
    ports:
      - "${NGINX_PORT:-8080}:${PORT:-8080}"
    environment:
      PORT: "${PORT:-8080}"
      API_HOST: api
      API_PORT: "5001"
      WEB_HOST: web
      WEB_PORT: "3000"
      API_WEBSOCKET_HOST: api-websocket
      API_WEBSOCKET_PORT: "5001"
      PLUGIN_DAEMON_HOST: plugin-daemon
      PLUGIN_DAEMON_PORT: "5002"
    depends_on:
      - api
      - api-websocket
      - web
      - plugin-daemon

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: difyai123456
      POSTGRES_DB: dify
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dify"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:6-alpine
    command: redis-server --requirepass difyai123456

  weaviate:
    image: semitechnologies/weaviate:1.27.0
    volumes:
      - weaviate_data:/var/lib/weaviate
    environment:
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      DEFAULT_VECTORIZER_MODULE: none
      AUTHENTICATION_APIKEY_ENABLED: "true"
      AUTHENTICATION_APIKEY_ALLOWED_KEYS: WVF5YThaHlkYwhGUSmCRgsX3tD5ngdN8pkih
      AUTHENTICATION_APIKEY_USERS: hello@dify.ai

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin1234567890
    volumes:
      - minio_data:/data

  ssrf-proxy:
    build:
      context: ./ssrf-proxy
      dockerfile: Dockerfile
    environment:
      HTTP_PORT: "3128"
      SSRF_SANDBOX_PROXY_HOST: sandbox
      SANDBOX_PORT: "8194"

  sandbox:
    image: langgenius/dify-sandbox:0.2.15
    environment:
      API_KEY: dify-sandbox
      ENABLE_NETWORK: "true"
      HTTP_PROXY: http://ssrf-proxy:3128
      HTTPS_PROXY: http://ssrf-proxy:3128
    depends_on:
      - ssrf-proxy

  api:
    image: langgenius/dify-api:1.17.0
    environment:
      MODE: api
      SECRET_KEY: sk-dify-local-dev-secret-key-change-me-in-prod
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: difyai123456
      DB_DATABASE: dify
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: difyai123456
      CELERY_BROKER_URL: redis://:difyai123456@redis:6379/1
      CONSOLE_API_URL: http://localhost:8080
      APP_API_URL: http://localhost:8080
      FILES_URL: http://localhost:8080
      VECTOR_STORE: weaviate
      WEAVIATE_ENDPOINT: http://weaviate:8080
      WEAVIATE_API_KEY: WVF5YThaHlkYwhGUSmCRgsX3tD5ngdN8pkih
      STORAGE_TYPE: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ADDRESS_STYLE: path
      S3_BUCKET_NAME: dify
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin1234567890
      CODE_EXECUTION_ENDPOINT: http://sandbox:8194
      CODE_EXECUTION_API_KEY: dify-sandbox
    depends_on:
      - postgres
      - redis
      - weaviate
      - minio
      - sandbox

  api-websocket:
    image: langgenius/dify-api:1.17.0
    environment:
      MODE: api
      SECRET_KEY: sk-dify-local-dev-secret-key-change-me-in-prod
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: difyai123456
      DB_DATABASE: dify
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: difyai123456
      SERVER_WORKER_CLASS: geventwebsocket.gunicorn.workers.GeventWebSocketWorker
    depends_on:
      - postgres
      - redis

  worker:
    image: langgenius/dify-api:1.17.0
    environment:
      MODE: worker
      SECRET_KEY: sk-dify-local-dev-secret-key-change-me-in-prod
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: difyai123456
      DB_DATABASE: dify
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: difyai123456
      CELERY_BROKER_URL: redis://:difyai123456@redis:6379/1
      VECTOR_STORE: weaviate
      WEAVIATE_ENDPOINT: http://weaviate:8080
      WEAVIATE_API_KEY: WVF5YThaHlkYwhGUSmCRgsX3tD5ngdN8pkih
      STORAGE_TYPE: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ADDRESS_STYLE: path
      S3_BUCKET_NAME: dify
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin1234567890
    depends_on:
      - postgres
      - redis
      - weaviate
      - minio

  worker-beat:
    image: langgenius/dify-api:1.17.0
    environment:
      MODE: beat
      SECRET_KEY: sk-dify-local-dev-secret-key-change-me-in-prod
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: difyai123456
      DB_DATABASE: dify
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: difyai123456
      CELERY_BROKER_URL: redis://:difyai123456@redis:6379/1
    depends_on:
      - postgres
      - redis

  web:
    image: langgenius/dify-web:1.17.0
    environment:
      CONSOLE_API_URL: http://localhost:8080
      APP_API_URL: http://localhost:8080
      SERVER_CONSOLE_API_URL: http://api:5001
      NEXT_PUBLIC_SOCKET_URL: ws://localhost:8080

  plugin-daemon:
    image: langgenius/dify-plugin-daemon:0.6.10-local
    volumes:
      - plugin_data:/app/storage
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: postgres
      DB_PASSWORD: difyai123456
      DB_DATABASE: dify_plugin
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: difyai123456
      SERVER_PORT: "5002"
      SERVER_KEY: lYkiYYT6owG+71oLerGzA7GXCgOT++6ovaezWAjpCjf+Sjc3ZtU+qUEi
      DIFY_INNER_API_URL: http://api:5001
      DIFY_INNER_API_KEY: QaHbTe77CtuXmsfyhR7+vRjI/+XbV1AaFy691iy+kGDv2Jvy0/eAh8Y1
    depends_on:
      - postgres
      - redis
      - api

volumes:
  postgres_data:
  weaviate_data:
  minio_data:
  plugin_data:
