# Local analogue of the Railway AppFlowy Cloud template.
# For production on Railway, use .railway/railway.ts (IaC).
# Based on https://github.com/AppFlowy-IO/AppFlowy-Cloud

services:
  nginx:
    build: ./nginx
    ports:
      - "${NGINX_PORT:-8080}:${PORT:-8080}"
    environment:
      PORT: "${PORT:-8080}"
      APPFLOWY_CLOUD_HOST: appflowy-cloud
      APPFLOWY_CLOUD_PORT: "8000"
      GOTRUE_HOST: gotrue
      GOTRUE_PORT: "9999"
      ADMIN_FRONTEND_HOST: admin-frontend
      ADMIN_FRONTEND_PORT: "3000"
      APPFLOWY_WEB_HOST: appflowy-web
      APPFLOWY_WEB_PORT: "80"
      MINIO_HOST: minio
      MINIO_API_PORT: "9000"
      MINIO_CONSOLE_PORT: "9001"
    depends_on:
      - appflowy-cloud
      - gotrue
      - admin-frontend
      - appflowy-web
      - minio

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  gotrue:
    image: appflowyinc/gotrue:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GOTRUE_ADMIN_EMAIL: admin@example.com
      GOTRUE_ADMIN_PASSWORD: password
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_SITE_URL: "appflowy-flutter://"
      GOTRUE_URI_ALLOW_LIST: "**"
      GOTRUE_JWT_SECRET: hello456
      GOTRUE_JWT_EXP: "604800"
      GOTRUE_JWT_ADMIN_GROUP_NAME: supabase_admin
      GOTRUE_DB_DRIVER: postgres
      API_EXTERNAL_URL: http://localhost:8080/gotrue
      DATABASE_URL: postgres://postgres:password@postgres:5432/postgres?search_path=auth
      PORT: "9999"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /gotrue/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /gotrue/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /gotrue/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /gotrue/verify

  appflowy-cloud:
    image: appflowyinc/appflowy_cloud:latest
    depends_on:
      gotrue:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      RUST_LOG: info
      APPFLOWY_ENVIRONMENT: production
      APPFLOWY_DATABASE_URL: postgres://postgres:password@postgres:5432/postgres
      APPFLOWY_REDIS_URI: redis://redis:6379
      APPFLOWY_GOTRUE_JWT_SECRET: hello456
      APPFLOWY_GOTRUE_BASE_URL: http://gotrue:9999
      APPFLOWY_S3_CREATE_BUCKET: "true"
      APPFLOWY_S3_USE_MINIO: "true"
      APPFLOWY_S3_MINIO_URL: http://minio:9000
      APPFLOWY_S3_ACCESS_KEY: minioadmin
      APPFLOWY_S3_SECRET_KEY: minioadmin
      APPFLOWY_S3_BUCKET: appflowy
      APPFLOWY_S3_PRESIGNED_URL_ENDPOINT: http://localhost:8080/minio-api
      APPFLOWY_ACCESS_CONTROL: "true"
      APPFLOWY_DATABASE_MAX_CONNECTIONS: "40"
      AI_SERVER_HOST: appflowy-ai
      AI_SERVER_PORT: "5001"
      AI_ENABLED: "true"
      APPFLOWY_WEB_URL: http://localhost:8080
      APPFLOWY_BASE_URL: http://localhost:8080
      APPFLOWY_SEARCH_SERVICE_URL: http://appflowy-search:4002

  admin-frontend:
    image: appflowyinc/admin_frontend:latest
    depends_on:
      - gotrue
      - appflowy-cloud
    environment:
      APPFLOWY_GOTRUE_BASE_URL: http://gotrue:9999
      APPFLOWY_BASE_URL: http://appflowy-cloud:8000

  appflowy-web:
    image: appflowyinc/appflowy_web:latest
    depends_on:
      - appflowy-cloud
    environment:
      APPFLOWY_BASE_URL: http://localhost:8080
      APPFLOWY_GOTRUE_BASE_URL: http://localhost:8080/gotrue
      APPFLOWY_WS_BASE_URL: ws://localhost:8080/ws/v2

  appflowy-worker:
    image: appflowyinc/appflowy_worker:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RUST_LOG: info
      APPFLOWY_ENVIRONMENT: production
      APPFLOWY_WORKER_REDIS_URL: redis://redis:6379
      APPFLOWY_WORKER_ENVIRONMENT: production
      APPFLOWY_WORKER_DATABASE_URL: postgres://postgres:password@postgres:5432/postgres
      APPFLOWY_WORKER_DATABASE_NAME: postgres
      APPFLOWY_WORKER_IMPORT_TICK_INTERVAL: "30"
      APPFLOWY_S3_USE_MINIO: "true"
      APPFLOWY_S3_MINIO_URL: http://minio:9000
      APPFLOWY_S3_ACCESS_KEY: minioadmin
      APPFLOWY_S3_SECRET_KEY: minioadmin
      APPFLOWY_S3_BUCKET: appflowy

  appflowy-ai:
    image: appflowyinc/appflowy_ai:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AI_SERVER_PORT: "5001"
      OPENAI_API_KEY: ""
      DEFAULT_AI_MODEL: gpt-4.1-mini
      DEFAULT_AI_COMPLETION_MODEL: gpt-4.1-mini
      APPFLOWY_S3_ACCESS_KEY: minioadmin
      APPFLOWY_S3_SECRET_KEY: minioadmin
      APPFLOWY_S3_BUCKET: appflowy
      AI_DATABASE_URL: postgres://postgres:password@postgres:5432/postgres
      AI_REDIS_URL: redis://redis:6379
      AI_USE_MINIO: "true"
      AI_MINIO_URL: http://minio:9000
      AI_APPFLOWY_HOST: http://localhost:8080
      APPFLOWY_GOTRUE_JWT_SECRET: hello456

  appflowy-search:
    image: appflowyinc/appflowy_search:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RUST_LOG: info
      APPFLOWY_SEARCH_HOST: "[::]"
      APPFLOWY_SEARCH_PORT: "4002"
      APPFLOWY_SEARCH_DATABASE_URL: postgres://postgres:password@postgres:5432/postgres
      APPFLOWY_SEARCH_REDIS_URL: redis://redis:6379
      APPFLOWY_S3_USE_MINIO: "true"
      APPFLOWY_S3_MINIO_URL: http://minio:9000
      APPFLOWY_S3_ACCESS_KEY: minioadmin
      APPFLOWY_S3_SECRET_KEY: minioadmin
      APPFLOWY_S3_BUCKET: appflowy
      APPFLOWY_BACKGROUND_INDEXER_ENABLED: "true"
      APPFLOWY_KEYWORD_SEARCH_ENABLED: "true"
      APPFLOWY_KEYWORD_WORKER_ENABLED: "true"
      APPFLOWY_KEYWORD_INDEX_DIR: /var/lib/appflowy/keyword_index
      APPFLOWY_GOTRUE_JWT_SECRET: hello456
    volumes:
      - keyword_index_data:/var/lib/appflowy/keyword_index

volumes:
  postgres_data:
  minio_data:
  keyword_index_data:
